<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>AE Plugin Suite — Preview</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Preview chrome: simulate the AE panel host window */
    body { display: flex; justify-content: center; align-items: flex-start; padding: 40px; background: #0a0a0a; min-height: 100vh; overflow: auto; }
    .panel-frame {
      width: 300px;
      height: 600px;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    /* override html/body overflow:hidden for preview */
    html, body { overflow: auto; height: auto; }
    #app { height: 600px; }
  </style>
</head>
<body>

  <div id="app">

<script>
/* ── Minimal stubs for preview ─────────────────────────────── */
var Utils = {
  el: function(tag, attrs, text) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
    if (text !== undefined) el.textContent = text;
    return el;
  },
  debounce: function(fn, ms) {
    var t; return function() { var a = arguments; clearTimeout(t); t = setTimeout(function() { fn.apply(null, a); }, ms); };
  },
  clamp: function(v, mn, mx) { return Math.min(Math.max(v, mn), mx); },
  round: function(v, d) { return parseFloat(v.toFixed(d)); },
  deepClone: function(o) { return JSON.parse(JSON.stringify(o)); }
};
var Presets = {
  list: function() { return Promise.resolve({ presets: ['Default', 'Soft Bloom', 'Neon Edge', 'Cinematic', 'Subtle Glow'], userPresets: ['My Preset'] }); },
  get: function() { return Promise.resolve({}); },
  save: function() { return Promise.resolve(); },
  isFactory: function(pid, name) { return ['Default','Soft Bloom','Neon Edge','Cinematic','Subtle Glow'].indexOf(name) >= 0; },
  'delete': function() { return Promise.resolve(); }
};
var Bridge = {
  call: function(action) {
    return new Promise(function(res) {
      setTimeout(function() {
        if (action === 'colorlab.apply') {
          res({ layer: 'Color Lab', effects: 8 });
        } else {
          res({ count: 3 });
        }
      }, 600);
    });
  },
  getAEVersion: function() { return Promise.resolve('25.0'); }
};
</script>

<!-- Components -->

<script src="js/components/ButtonGroup.js"></script>

<script>
/* ── Tab switching ─────────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('pane-' + btn.dataset.tab).classList.add('active');
  });
});

  var btn = Utils.el('button', { class: 'action-btn' }, 'Generate Slides');

  document.getElementById('preset-slides').appendChild(new PresetBar({ pluginId: 'slides', onLoad: function(){}, getParams: function(){ return {}; } }).el);

<!-- New plugin UI modules (use actual modules with stub Bridge) -->
<script src="js/factory-presets.js"></script>
<script src="js/plugins/colorlab/ui.js"></script>
<script src="js/plugins/gradient/ui.js"></script>
<script src="js/plugins/patterns/ui.js"></script>
<script src="js/plugins/physics/ui.js"></script>
<script src="js/plugins/particles/ui.js"></script>

<script>
if (window.Tooltip) Tooltip.init();

/* ── Wire up new plugin panes ──────────────────────────────── */
(function() {
  var pluginMap = {
    colorlab:  { ui: window.ColorLabUI,  id: 'colorlab' },
    gradient:  { ui: window.GradientUI,  id: 'gradient' },
    patterns:  { ui: window.PatternsUI,  id: 'patterns' },
    physics:   { ui: window.PhysicsUI,   id: 'physics' },
    particles: { ui: window.ParticlesUI, id: 'particles' }
  };

  Object.keys(pluginMap).forEach(function(tab) {
    var entry    = pluginMap[tab];
    var controls = document.getElementById('controls-' + tab);
    var presetEl = document.getElementById('preset-' + tab);
    if (!entry.ui || !controls) return;

    entry.ui.init(controls);

    var bar = new PresetBar({
      pluginId: entry.id,
      getParams: function() { return entry.ui.getParams(); },
      onLoad: function(p) { entry.ui.applyPreset(p); }
    });
    presetEl.appendChild(bar.el);
  });
})();
</script>
