<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>AE Plugin Suite — Preview</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Preview chrome: simulate the AE panel host window.
       Mirrors the production index.html (3 hero tools: Dist · Color · Glow).
       Uses mock Bridge/Presets/Utils so it runs in a plain browser — no AE. */
    body { display: flex; justify-content: center; align-items: flex-start; padding: 40px; background: #0a0a0a; min-height: 100vh; overflow: auto; }
    .panel-frame {
      width: 300px;
      height: 600px;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    html, body { overflow: auto; height: auto; }
    #app { height: 600px; }
  </style>
</head>
<body>
<div class="panel-frame">
  <div id="app">

    <!-- ── Tab Strip (3 hero tools — matches index.html) ────── -->
    <div class="tab-strip" role="tablist">

      <button class="tab-btn active" data-tab="dist"
              role="tab" aria-selected="true" title="Distortions Suite">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M1,5 C3,2 5,8 8,5 C11,2 13,8 15,5"/>
          <path d="M1,11 C3,8 5,14 8,11 C11,8 13,14 15,11"/>
        </svg>
        Dist
      </button>

      <button class="tab-btn" data-tab="colorlab"
              role="tab" aria-selected="false" title="Color Lab">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="8" cy="8" r="5.5"/>
          <path d="M8 2.5 L8 8 L12.5 5.5"/>
          <path d="M8 8 L3.5 10.5"/>
          <path d="M8 8 L8 13.5"/>
        </svg>
        Color
      </button>

      <button class="tab-btn" data-tab="glow"
              role="tab" aria-selected="false" title="Deep Glow">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="8" cy="8" r="2.4"/>
          <line x1="8" y1="1"  x2="8" y2="3.2"/>
          <line x1="8" y1="12.8" x2="8" y2="15"/>
          <line x1="1"  y1="8" x2="3.2" y2="8"/>
          <line x1="12.8" y1="8" x2="15" y2="8"/>
          <line x1="3.1" y1="3.1" x2="4.7" y2="4.7"/>
          <line x1="11.3" y1="11.3" x2="12.9" y2="12.9"/>
          <line x1="12.9" y1="3.1" x2="11.3" y2="4.7"/>
          <line x1="4.7" y1="11.3" x2="3.1" y2="12.9"/>
        </svg>
        Glow
      </button>

    </div>

    <!-- ── Plugin name bar ──────────────────────────────────── -->
    <div class="plugin-bar" id="plugin-bar">
      <span class="plugin-bar-name" id="plugin-bar-name">Distortions Suite</span>
    </div>

    <!-- ── Panes ────────────────────────────────────────────── -->
    <div class="tab-pane active" id="pane-dist" role="tabpanel">
      <div class="pane-scroll" id="controls-dist"></div>
    </div>
    <div class="tab-pane" id="pane-colorlab" role="tabpanel">
      <div class="pane-scroll" id="controls-colorlab"></div>
    </div>
    <div class="tab-pane" id="pane-glow" role="tabpanel">
      <div class="pane-scroll" id="controls-glow"></div>
    </div>

  </div>
</div>

<script>
/* ── Minimal mock host (replaces the CEP bridge for browser preview) ── */
var Utils = {
  el: function(tag, attrs, text) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
    if (text !== undefined) el.textContent = text;
    return el;
  },
  debounce: function(fn, ms) {
    var t; return function() { var a = arguments; clearTimeout(t); t = setTimeout(function() { fn.apply(null, a); }, ms); };
  },
  clamp: function(v, mn, mx) { return Math.min(Math.max(v, mn), mx); },
  round: function(v, d) { return parseFloat(v.toFixed(d)); },
  deepClone: function(o) { return JSON.parse(JSON.stringify(o)); }
};
// Presets uses the REAL js/core/presets.js (loaded below) so the preview shows
// the actual FactoryPresets. User save/load just round-trips the mock Bridge.
var Bridge = {
  call: function(action) {
    return new Promise(function(res) {
      setTimeout(function() {
        if (action === 'colorlab.apply')        res({ layer: 'Color Lab', effects: 1 });
        else if (action === 'glow.apply')        res({ layers: 2 });
        else if (action === 'distortions.apply') res({ layers: 1 });
        else                                     res({ ok: true });
      }, 500);
    });
  },
  getAEVersion: function() { return Promise.resolve('25.0'); }
};
</script>

<!-- Real, browser-safe core + components -->
<script src="js/core/sections.js"></script>
<script src="js/components/Slider.js"></script>
<script src="js/components/Dropdown.js"></script>
<script src="js/components/ButtonGroup.js"></script>
<script src="js/components/Toggle.js"></script>
<script src="js/components/ColorPicker.js"></script>
<script src="js/components/PresetBar.js"></script>
<script src="js/components/Tooltip.js"></script>

<!-- Built-in presets + the 3 hero plugin UIs (real modules) -->
<script src="js/factory-presets.js"></script>
<script src="js/core/presets.js"></script>
<script src="js/plugins/distortions/ui.js"></script>
<script src="js/plugins/colorlab/ui.js"></script>
<script src="js/plugins/glow/ui.js"></script>

<script>
/* ── Bootstrap (mirrors js/app.js, trimmed for the mock host) ───────── */
(function () {
  if (window.Tooltip) Tooltip.init();

  var tabs = [
    { tab: 'dist',     name: 'Distortions Suite', ui: window.DistortionsUI, id: 'distortions' },
    { tab: 'colorlab', name: 'Color Lab',         ui: window.ColorLabUI,    id: 'colorlab' },
    { tab: 'glow',     name: 'Deep Glow',         ui: window.GlowUI,        id: 'glow' }
  ];

  var nameEl = document.getElementById('plugin-bar-name');

  function setActiveTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      var on = b.getAttribute('data-tab') === tab;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.tab-pane').forEach(function (p) {
      p.classList.toggle('active', p.id === 'pane-' + tab);
    });
    var entry = tabs.filter(function (t) { return t.tab === tab; })[0];
    if (nameEl && entry) nameEl.textContent = entry.name;
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { setActiveTab(btn.getAttribute('data-tab')); });
  });

  tabs.forEach(function (entry) {
    var controls = document.getElementById('controls-' + entry.tab);
    var pane     = document.getElementById('pane-' + entry.tab);
    if (!entry.ui || !controls || !pane) return;

    entry.ui.init(controls);
    if (window.Sections) Sections.makeCollapsible(controls);

    var bar = new PresetBar({
      pluginId: entry.id,
      getParams: function () { return entry.ui.getParams(); },
      onLoad: function (params) { entry.ui.applyPreset(params); }
    });
    pane.appendChild(bar.el);
  });

  setActiveTab('dist');
}());
</script>
</body>
</html>
